# Calamares bootloader configuration for MindOS Paradise
# Multi-arch compatible: uses grub-install and installs EFI fallback (BOOTX64.EFI or BOOTAA64.EFI)
---
efiBootLoader: "grub"
installEFIFallback: true
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
