---
# Kurulumdan sonra canlı sisteme ait paketler kaldırılır.
# try_remove: listedeki bir paket yoksa kurulum durmaz.
backend: apt
operations:
  - try_remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'live-task-localisation'
      - 'live-task-recommended'
      - 'calamares-settings-debian'
      - 'calamares'
