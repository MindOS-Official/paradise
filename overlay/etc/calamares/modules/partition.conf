---
# MindOS Paradise bölümleme ayarları
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 300MiB
    minimumSize: 32MiB
    label: "EFI"

# Sistem RAM'de sıkıştırılmış takas (zram) kullandığı için varsayılan olarak disk takası
# oluşturulmaz; isteyen küçük bir takas bölümü ya da takas dosyası seçebilir.
userSwapChoices:
    - none
    - small
    - file
initialSwapChoice: none

drawNestedPartitions: false
alwaysShowPartitionLabels: true
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]
