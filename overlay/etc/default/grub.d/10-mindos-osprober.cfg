# MindOS: Debian 13 os-prober i varsayılan olarak kapatır; Windows ve diğer sistemler GRUB menüsünde görünsün.
GRUB_DISABLE_OS_PROBER=false
# Türkçe dil ayarında büyük/küçük harf duyarsız "efi" araması "EFI" klasörüyle eşleşmez (i/İ), os-prober
# Windows'u bulamaz. GRUB menüsü dilden bağımsız ortamda üretilir.
export LC_ALL=C.UTF-8
