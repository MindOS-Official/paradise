# MindOS Paradise: ARM64 UEFI Hardware & Console Configuration
# Ensures console redirection to both graphical framebuffer (tty0) and serial console (ttyAMA0,115200)

if [ "$(dpkg --print-architecture 2>/dev/null || uname -m)" = "arm64" ] || [ "$(dpkg --print-architecture 2>/dev/null || uname -m)" = "aarch64" ]; then
    GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:-} console=tty0 console=ttyAMA0,115200"
    GRUB_TERMINAL_INPUT="console serial"
    GRUB_TERMINAL_OUTPUT="gfxterm serial"
    GRUB_SERIAL_COMMAND="serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1"
fi
