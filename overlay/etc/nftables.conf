#!/usr/sbin/nft -f
# MindOS Paradise güvenlik duvarı: gelen bağlantılar kapalı, giden serbest.
# Bir port açmak için: input zincirine "tcp dport <port> accept" satırı ekleyin.
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto ipv6-icmp accept
		icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept
		udp dport 546 ip6 saddr fe80::/10 accept comment "DHCPv6 istemcisi"
		udp dport 5353 accept comment "mDNS (yazıcı ve cihaz bulma)"
	}
	chain forward {
		type filter hook forward priority filter; policy accept;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
