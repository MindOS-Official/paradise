source /boot/grub/config.cfg
set timeout=5

menuentry "MindOS Paradise" --hotkey=l {
	linux	/live/vmlinuz boot=live components quiet splash plymouth.theme=mindos findiso=${iso_path}
	initrd	/live/initrd.img
}
menuentry "Install MindOS Paradise" --hotkey=i {
	linux	/live/vmlinuz boot=live components quiet splash plymouth.theme=mindos findiso=${iso_path} mindos.install
	initrd	/live/initrd.img
}
menuentry "MindOS Paradise (English)" --hotkey=n {
	linux	/live/vmlinuz boot=live components quiet splash plymouth.theme=mindos findiso=${iso_path} locales=en_US.UTF-8 keyboard-layouts=us timezone=UTC
	initrd	/live/initrd.img
}
menuentry "MindOS Paradise (verbose boot: shows messages)" --hotkey=d {
	linux	/live/vmlinuz boot=live components nosplash findiso=${iso_path}
	initrd	/live/initrd.img
}
menuentry "MindOS Paradise (safe graphics: nomodeset)" --hotkey=g {
	linux	/live/vmlinuz boot=live components quiet splash plymouth.theme=mindos nomodeset findiso=${iso_path}
	initrd	/live/initrd.img
}
menuentry "MindOS Paradise (fail-safe mode)" --hotkey=s {
	linux	/live/vmlinuz boot=live components noapic noapm nodma nomce nosmp nosplash nomodeset findiso=${iso_path}
	initrd	/live/initrd.img
}

# Secure Boot açık bilgisayarlarda MindOS kernel'i, MindOS anahtarı bir kez kaydedilene kadar açılmaz.
# Bu girdi MokManager'ı açar: "Enroll key from disk" -> MINDOS_EFI -> EFI/mindos/MindOS-SecureBoot.cer
if [ "${shim_lock}" = "y" -o "${lockdown}" = "y" ]; then
	menuentry "Secure Boot: Enroll MindOS key (first boot only)" --hotkey=k {
		if [ -f /EFI/boot/mmaa64.efi ]; then
			chainloader /EFI/boot/mmaa64.efi
		else
			chainloader /EFI/boot/mmx64.efi
		fi
	}
fi

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest (if any)
	if false; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if true; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	/live/vmlinuz boot=live components   findiso=${iso_path} verify-checksums
			initrd	/live/initrd.img
		}
	fi
}
