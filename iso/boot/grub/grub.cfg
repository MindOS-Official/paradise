source /boot/grub/config.cfg
set timeout=5

# Serial and console configuration for ARM64 and UEFI
if [ "${grub_cpu}" = "arm64" -o -f /EFI/boot/bootaa64.efi ]; then
	set console_cmdline="console=tty0 console=ttyAMA0,115200"
	insmod serial
	serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
	terminal_input console serial
	terminal_output console serial
else
	set console_cmdline=""
fi

menuentry "MindOS Paradise" --hotkey=l {
	linux	/live/vmlinuz boot=live components quiet splash plymouth.theme=mindos findiso=${iso_path} ${console_cmdline}
	initrd	/live/initrd.img
	if [ -n "${devicetree_path}" ]; then
		devicetree ${devicetree_path}
	elif [ -f /boot/dtb ]; then
		devicetree /boot/dtb
	elif [ -f /live/dtb.img ]; then
		devicetree /live/dtb.img
	elif [ -f /live/devicetree ]; then
		devicetree /live/devicetree
	fi
}
menuentry "Install MindOS Paradise" --hotkey=i {
	linux	/live/vmlinuz boot=live components quiet splash plymouth.theme=mindos findiso=${iso_path} mindos.install ${console_cmdline}
	initrd	/live/initrd.img
	if [ -n "${devicetree_path}" ]; then
		devicetree ${devicetree_path}
	elif [ -f /boot/dtb ]; then
		devicetree /boot/dtb
	elif [ -f /live/devicetree ]; then
		devicetree /live/devicetree
	fi
}
