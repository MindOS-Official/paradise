label live-amd64
	menu label ^MindOS Paradise
	menu default
	linux /live/vmlinuz
	initrd /live/initrd.img
	append boot=live components quiet splash plymouth.theme=mindos

label install-amd64
	menu label ^Install MindOS Paradise
	linux /live/vmlinuz
	initrd /live/initrd.img
	append boot=live components quiet splash plymouth.theme=mindos mindos.install

label live-amd64-en
	menu label MindOS Paradise (^English)
	linux /live/vmlinuz
	initrd /live/initrd.img
	append boot=live components quiet splash plymouth.theme=mindos locales=en_US.UTF-8 keyboard-layouts=us timezone=UTC

label live-amd64-verbose
	menu label MindOS Paradise (^verbose boot: shows messages)
	linux /live/vmlinuz
	initrd /live/initrd.img
	append boot=live components nosplash

label live-amd64-nomodeset
	menu label MindOS Paradise (safe ^graphics: nomodeset)
	linux /live/vmlinuz
	initrd /live/initrd.img
	append boot=live components quiet splash plymouth.theme=mindos nomodeset

label live-amd64-failsafe
	menu label MindOS Paradise (^fail-safe mode)
	linux /live/vmlinuz
	initrd /live/initrd.img
	append boot=live components noapic noapm nodma nomce nosmp nosplash nomodeset
